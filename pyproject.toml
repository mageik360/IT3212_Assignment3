[project]
name = "it3212-assignment3"
version = "0.1.0"
description = "Machine learning experiments on the smoking and drinking dataset"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "torch",
    "tqdm",
    "joblib",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "pytest",
    "ruff",
]
